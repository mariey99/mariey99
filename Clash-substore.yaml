mixed-port: 7890
allow-lan: true
mode: rule
log-level: info
external-controller: :9090

dns:
  enable: true
  listen: 0.0.0.0:1053

  default-nameserver:
    - 223.5.5.5
    - 8.8.8.8
    - 1.1.1.1

  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query

  nameserver-policy:
    "geosite:gfw,geolocation-cn":
      - https://1.1.1.1/dns-query#手动切换
      - https://1.0.0.1/dns-query#手动切换
      - https://8.8.8.8/dns-query#手动切换

  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    - https://8.8.8.8/dns-query#手动切换

  fallback:
    - https://1.1.1.1/dns-query#手动切换
    - https://1.0.0.1/dns-query#手动切换
    - https://8.8.8.8/dns-query#手动切换

  fallback-filter:
    geoip: false
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4

  fake-ip-filter:
    - +.lan
    - +.microsoft*.com
    - localhost.ptlogin2.qq.com

proxy-groups:

  - name: 自动选择
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true

  - name: 手动切换
    type: select

  - name: AI服务
    type: select
    proxies:
      - 手动切换
      - 自动选择

  - name: Apple服务
    type: select
    proxies:
      - 手动切换
      - 自动选择

  - name: 微软服务
    type: select
    proxies:
      - 手动切换
      - 自动选择

  - name: Steam服务
    type: select
    proxies:
      - 手动切换
      - 自动选择

  - name: 全球直连
    type: select
    proxies:
      - DIRECT

  - name: 广告拦截
    type: select
    proxies:
      - REJECT

  - name: 漏网之鱼
    type: select
    proxies:
      - 手动切换
      - 自动选择

